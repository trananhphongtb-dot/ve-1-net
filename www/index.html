<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Vẽ Đơn Giản</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      * { box-sizing: border-box; }
      :root{
        --bg:#F4F1EA; --paper:#FFFFFF; --paper2:#FBF8F1; --ink:#2E2A24; --ink-soft:#6B645A;
        --line:#E4DCCB; --accent:#E4572E; --accent-ink:#FFFFFF; --teal:#0E7C66; --teal-soft:#DFF2EC;
        --sun:#F2A007; --sun-soft:#FDEECB; --sky:#2D7FB8; --pink:#D65076;
        --guide:#B9AE97; --shadow:0 2px 10px rgba(46,42,36,.08);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#1C1A17; --paper:#292520; --paper2:#231F1B; --ink:#F2EBDD; --ink-soft:#B4AB9A;
          --line:#453E34; --accent:#F0714A; --teal:#3DB894; --teal-soft:#1E3A32;
          --sun:#F5B93F; --sun-soft:#40351A; --sky:#5FA8D3; --pink:#E87A9C;
          --guide:#7A7261; --shadow:0 2px 10px rgba(0,0,0,.35);
        }
      }
      html{ -webkit-text-size-adjust:100%; height:100%; }
      /* KHUNG APP 3 PHẦN CỐ ĐỊNH (nguyên tắc chung):
         - Nền (body) tràn toàn màn hình, kể cả dưới thanh trạng thái / thanh điều hướng.
         - Hàng nút TRÊN nằm trọn dưới vùng an toàn trên (env(safe-area-inset-top)):
           không bao giờ tràn lên thanh thông báo hệ thống, luôn bấm được.
         - Phần GIỮA (bảng vẽ) co giãn theo đúng chiều cao còn lại.
         - Hàng nút DƯỚI + thanh tin nhắn ghim TẬN ĐÁY, trên vùng an toàn dưới.
         Trang không cuộn dọc nữa nên không phần tử nào chui xuống dưới phần tử khác. */
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:"Be Vietnam Pro", system-ui, sans-serif; font-size:15px; line-height:1.45;
        height:100dvh; display:flex; flex-direction:column; overflow:hidden;
        overscroll-behavior:none;
        padding-top:env(safe-area-inset-top, 0px);
        padding-bottom:env(safe-area-inset-bottom, 0px);
      }
      .wrap{
        flex:1 1 auto; min-height:0; width:100%; max-width:640px; margin:0 auto;
        padding:6px 6px 4px; display:flex; flex-direction:column;
      }
      /* Mỗi panel là 1 cột flex cao đúng phần giữa: các thanh/nút flex:0 0 auto,
         riêng bảng vẽ flex:1 co giãn — nút dưới tự bị đẩy xuống tận đáy panel. */
      section[role="tabpanel"]{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      section[role="tabpanel"] > *{ flex:0 0 auto; }
      #partTrace, #partSelf{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      #partTrace > *, #partSelf > *{ flex:0 0 auto; }
      h1,h2,h3{ font-family:"Baloo 2","Be Vietnam Pro",sans-serif; margin:0; line-height:1.2; }

      /* Tabs */
      .tabs{
        flex:0 0 auto;
        display:flex; gap:4px; background:var(--paper); border:1.5px solid var(--line);
        border-radius:12px; padding:4px; box-shadow:var(--shadow);
      }
      .tab{
        flex:1 1 0; min-width:0; border:0; border-radius:9px; background:transparent; color:var(--ink-soft);
        font-family:"Baloo 2",sans-serif; font-weight:700; font-size:14px; padding:4px 2px; cursor:pointer;
        min-height:34px; white-space:nowrap;
      }
      .tab[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
      .tab:focus-visible, button:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }
      [hidden]{ display:none !important; }

      /* Sub-mode toggle (Tab Học Vẽ: 2 phần) */
      .subtabs{
        display:flex; gap:4px; margin-top:4px; background:var(--paper2);
        border:1.5px solid var(--line); border-radius:11px; padding:3px;
      }
      .subtab{
        flex:1 1 0; min-width:0; border:0; border-radius:8px; background:transparent; color:var(--ink-soft);
        font-family:"Baloo 2",sans-serif; font-weight:700; font-size:13px; padding:4px 4px; cursor:pointer;
        min-height:32px; white-space:nowrap;
      }
      .subtab[aria-pressed="true"]{ background:var(--teal); color:#fff; }

      /* Level / figure pickers */
      .picker{ display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:5px; margin-top:6px; }
      .pick{
        border:2px solid var(--line); background:var(--paper); border-radius:11px; padding:5px 3px 4px;
        cursor:pointer; text-align:center; color:var(--ink); font-family:inherit;
      }
      .pick .nm{ display:block; font-weight:600; font-size:13px; line-height:1.25; }
      .pick .meta{ display:block; font-size:11px; color:var(--ink-soft); margin-top:1px; }
      .pick .st{ display:block; font-size:12px; color:var(--sun); letter-spacing:2px; min-height:15px; margin-top:1px; }
      .pick .st.none{ color:var(--guide); letter-spacing:0; font-size:11.5px; }
      .pick[aria-current="true"]{ border-color:var(--accent); background:var(--sun-soft); }
      .pick:disabled{ opacity:.55; cursor:not-allowed; background:var(--paper2); }
      .pick:disabled svg{ opacity:.5; }
      .pick svg{ display:block; margin:0 auto 4px; }

      /* Thanh "đang ở màn / hình nào" — thay lưới chọn: màn/hình sau ẨN hẳn,
         học xong màn/hình này mới mở, không hiện hết ra cùng lúc. */
      .now-bar{
        margin-top:4px; background:var(--paper); border:1.5px solid var(--line); border-radius:10px;
        padding:4px 8px; display:flex; flex-wrap:wrap; gap:0 8px; align-items:baseline; justify-content:center;
        text-align:center;
      }
      .now-bar .t{ font-family:"Baloo 2",sans-serif; font-weight:800; font-size:14.5px; }
      .now-bar .s{ font-size:11.5px; color:var(--ink-soft); }

      /* HUD */
      .hud{
        display:flex; flex-wrap:nowrap; gap:4px; margin-top:4px;
      }
      .hud .cell{
        flex:1 1 0; min-width:0; background:var(--paper); border:1.5px solid var(--line); border-radius:10px;
        padding:2px 4px; text-align:center;
      }
      .hud .k{ display:block; font-size:10px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; overflow:hidden; }
      .hud .v{ display:block; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; }

      /* Board — nội dung trọng tâm ở GIỮA: chiếm hết chiều cao còn lại giữa
         hàng nút trên và hàng nút dưới, tự co nhỏ khi màn hình thấp,
         không bao giờ đẩy nút dưới tràn xuống thanh tin nhắn. */
      .board-card{
        flex:1 1 auto !important; min-height:0;
        position:relative; margin-top:4px; background:var(--paper);
        background-image:radial-gradient(var(--line) 1.1px, transparent 1.2px);
        background-size:22px 22px; background-position:center;
        border:1.5px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
        display:flex; align-items:center; justify-content:center;
      }
      .board-card svg{ display:block; width:auto; height:auto; max-width:100%; max-height:100%; touch-action:none; }
      .board-card canvas{ display:block; width:auto; height:auto; max-width:100%; max-height:100%; touch-action:none; cursor:crosshair; }

      /* (Phần 2 của tab Học Vẽ giờ vẽ trên 1 bảng như Phần 1 — không còn layout 2 ô) */

      /* Score box */
      .score-box{
        margin-top:4px; background:var(--paper); border:1.5px solid var(--teal); border-radius:12px;
        padding:5px 8px; display:none; align-items:center; gap:8px; flex-wrap:wrap;
      }
      .score-box.show{ display:flex; }
      .score-box .num{ font-family:"Baloo 2",sans-serif; font-weight:800; font-size:26px; line-height:1; color:var(--teal); }
      .score-box .num small{ font-size:14px; color:var(--ink-soft); font-weight:700; }
      .score-box .detail{ flex:1 1 200px; }
      .score-box .detail .stars{ color:var(--sun); font-size:18px; letter-spacing:3px; line-height:1.2; }
      .score-box .detail .stars .off{ color:var(--line); }
      .score-box .detail p{ margin:1px 0 0; font-size:13px; color:var(--ink-soft); }
      .score-box .detail p strong{ color:var(--ink); }

      /* Controls — lưới 6 cột đối xứng: mặc định 3 nút/hàng (mỗi nút 2 cột);
         nhóm 5 nút: hàng 2 có 2 nút, mỗi nút 3 cột, cân đều hai bên;
         nhóm 2 nút: mỗi nút 3 cột. Mọi nút cùng chiều cao thon gọn 34px. */
      .controls{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-top:4px; }
      .controls .btn{ grid-column:span 2; }
      .controls.c2 .btn{ grid-column:span 3; }
      .controls.c5 .btn:nth-child(4), .controls.c5 .btn:nth-child(5){ grid-column:span 3; }
      .btn{
        border:1.5px solid var(--line); background:var(--paper); color:var(--ink); border-radius:10px;
        font-family:"Baloo 2",sans-serif; font-weight:700; font-size:13.5px; padding:3px 4px; cursor:pointer;
        min-height:34px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
      .btn.warn{ background:var(--sun-soft); border-color:var(--sun); color:var(--ink); }
      .btn:active{ transform:translateY(1px); }
      .btn:disabled{ opacity:.45; cursor:default; transform:none; }

      /* MỘT thanh thông báo duy nhất cho cả app: nằm trong luồng trang, GHIM TẬN ĐÁY
         dưới hàng nút dưới cùng (không còn position:fixed nổi lên trên nữa nên
         không thể đè / che bất kỳ nút nào), chiều cao không đổi,
         chữ tối đa 2 dòng rồi cắt — không tràn, không nhảy chỗ. */
      .msg{
        flex:0 0 auto; align-self:center;
        width:min(94vw, 628px); height:48px; margin:0 0 6px;
        background:var(--teal-soft); color:var(--ink);
        border:1.5px solid var(--teal); border-radius:10px; box-shadow:var(--shadow);
        padding:3px 10px; font-size:13px; line-height:1.3; text-align:center;
        display:flex; align-items:center; justify-content:center; overflow:hidden;
      }
      .msg span{
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      }
      .msg.bad{ background:var(--sun-soft); border-color:var(--sun); }

      /* Win / done overlay */
      .overlay{
        position:absolute; inset:0; display:none; align-items:center; justify-content:center;
        background:color-mix(in srgb, var(--paper) 88%, transparent); padding:18px; z-index:5;
      }
      .overlay.show{ display:flex; }
      .overlay .box{ text-align:center; max-width:320px; }
      .overlay .stars{ font-size:36px; letter-spacing:5px; color:var(--sun); line-height:1; }
      .overlay .stars .off{ color:var(--line); }
      .overlay h2{ font-size:23px; margin:6px 0 3px; }
      .overlay p{ margin:0 0 10px; color:var(--ink-soft); font-size:14px; }
      .overlay .row{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; }
      .overlay .row .btn{ flex:0 1 auto; padding-left:10px; padding-right:10px; }

      /* Free draw toolbar — căn giữa đối xứng */
      .toolbar{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; margin-top:4px; }
      .swatches{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
      .sw{
        width:32px; height:32px; min-height:32px; border-radius:50%; border:3px solid var(--paper); cursor:pointer; padding:0;
        box-shadow:0 0 0 2px var(--line);
      }
      .sw[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--ink); }
      .sizes{ display:flex; gap:6px; }
      .size-btn{
        width:36px; height:36px; min-height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
        cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
      }
      .size-btn[aria-pressed="true"]{ border-color:var(--accent); background:var(--sun-soft); }
      .size-btn i{ display:block; border-radius:50%; background:var(--ink); }

      .total-bar{
        margin-top:4px; display:flex; justify-content:space-between; align-items:center;
        background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:4px 8px;
        font-weight:600; font-size:13.5px;
      }
      .total-bar .stars{ color:var(--sun); letter-spacing:2px; }

      .confetti{ position:absolute; width:9px; height:14px; border-radius:2px; pointer-events:none; z-index:9; }
      @keyframes fall{ to{ transform:translateY(340px) rotate(560deg); opacity:0; } }
      @media (prefers-reduced-motion: reduce){
        .confetti{ display:none; }
        .btn:active{ transform:none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav class="tabs" role="tablist" aria-label="Chọn chế độ">
        <button class="tab" role="tab" id="tab-game" aria-selected="true" aria-controls="panel-game">Vẽ 1 Nét</button>
        <button class="tab" role="tab" id="tab-learn" aria-selected="false" aria-controls="panel-learn">Học Vẽ</button>
        <button class="tab" role="tab" id="tab-free" aria-selected="false" aria-controls="panel-free">Vẽ Tự Do</button>
      </nav>

      <!-- ============ GAME: VẼ 1 NÉT ============ -->
      <section id="panel-game" role="tabpanel" aria-labelledby="tab-game">
        <div class="now-bar" id="levelNow" aria-label="Màn đang chơi"></div>

        <div class="hud" aria-label="Thông tin màn chơi">
          <div class="cell"><span class="k">Màn</span><span class="v" id="hudLevel">1 / 14</span></div>
          <div class="cell"><span class="k">Đường</span><span class="v" id="hudEdges">0 / 1</span></div>
          <div class="cell"><span class="k">Nét</span><span class="v" id="hudStrokes">–</span></div>
          <div class="cell"><span class="k">Giờ</span><span class="v" id="hudTime">0:00</span></div>
        </div>

        <div class="board-card" id="gameCard">
          <canvas id="gameCanvas" width="900" height="900" aria-label="Bàn vẽ 1 nét — bấm vào các chấm để nối đường"></canvas>
          <div class="overlay" id="winOverlay">
            <div class="box">
              <div class="stars" id="winStars">★★★</div>
              <h2 id="winTitle">Vẽ xong rồi!</h2>
              <p id="winText"></p>
              <div class="row">
                <button class="btn" id="winReplay">Chơi lại</button>
                <button class="btn primary" id="winBlind">Tự vẽ không mẫu</button>
                <button class="btn primary" id="winNext">Màn tiếp theo</button>
              </div>
            </div>
          </div>
        </div>

        <div class="controls" id="blindBar" hidden>
          <button class="btn primary" id="btnBlindDone">Vẽ xong</button>
          <button class="btn" id="btnBlindClear">Xóa</button>
          <button class="btn" id="btnBlindSkip">Bỏ qua</button>
        </div>

        <div class="controls c5">
          <button class="btn warn" id="btnHint">Gợi ý</button>
          <button class="btn" id="btnUndo">Hoàn tác</button>
          <button class="btn" id="btnReset">Vẽ lại</button>
          <button class="btn" id="btnPrev">‹ Trước</button>
          <button class="btn" id="btnNext">Sau ›</button>
        </div>

        <div class="total-bar"><span>Tổng sao</span><span><span class="stars" id="totalStars">☆☆☆</span> <span id="totalText">0 / 42 sao</span></span></div>
      </section>

      <!-- ============ HỌC VẼ: PHẦN 1 ĐỒ THEO NÉT ĐỨT TỪNG BƯỚC · PHẦN 2 TỰ VẼ TRÊN CÙNG 1 BẢNG, CHẤM ĐIỂM ============ -->
      <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
        <div class="now-bar" id="lessonNow" aria-label="Hình đang học"></div>

        <div class="subtabs" role="group" aria-label="Chọn phần học">
          <button class="subtab" id="subLearn" aria-pressed="true">1 · Vẽ học</button>
          <button class="subtab" id="subSelf" aria-pressed="false">2 · Tự vẽ</button>
        </div>

        <div id="partTrace">
          <div class="hud" aria-label="Tiến độ vẽ học">
            <div class="cell"><span class="k">Nét kín</span><span class="v" id="traceStepNum">0 / 7</span></div>
            <div class="cell" style="flex:2 1 0"><span class="k">Đang vẽ</span><span class="v" id="traceStepLabel" style="font-size:13.5px">—</span></div>
          </div>
          <div class="board-card" id="traceCard">
            <canvas id="traceCanvas" width="900" height="900" aria-label="Bảng vẽ học — chỉ hiện 1 nét đứt đang vẽ, đồ kín mới hiện nét tiếp theo"></canvas>
          </div>
          <div class="controls">
            <button class="btn" id="btnTraceUndo">Hoàn tác</button>
            <button class="btn" id="btnTraceResetStep">Xóa</button>
            <button class="btn" id="btnTracePeek" aria-pressed="false">Xem hình</button>
          </div>
        </div>

        <div id="partSelf" hidden>
        <div class="board-card" id="drawCard">
          <canvas id="drawCanvas" width="900" height="900" aria-label="Bảng tự vẽ — bảng trống, không có nét đứt nào, tự vẽ theo trí nhớ rồi bấm Chấm điểm"></canvas>
        </div>

        <div class="score-box" id="scoreBox" aria-live="polite">
          <div class="num"><span id="scoreNum">0</span><small> / 100</small></div>
          <div class="detail">
            <div class="stars" id="scoreStars">★★★</div>
            <p id="scoreText"></p>
          </div>
        </div>

        <div class="controls c5">
          <button class="btn primary" id="btnScore">Chấm điểm</button>
          <button class="btn" id="btnDrawUndo">Hoàn tác</button>
          <button class="btn" id="btnDrawClear">Xóa hết</button>
          <button class="btn" id="btnLessonPrev">‹ Trước</button>
          <button class="btn" id="btnLessonNext">Sau ›</button>
        </div>

        </div>
      </section>

      <!-- ============ VẼ TỰ DO ============ -->
      <section id="panel-free" role="tabpanel" aria-labelledby="tab-free" hidden>
        <div class="toolbar">
          <div class="swatches" id="swatches" aria-label="Chọn màu bút"></div>
          <div class="sizes" id="sizes" aria-label="Chọn cỡ bút"></div>
        </div>
        <div class="board-card">
          <canvas id="freeCanvas" width="900" height="900" aria-label="Bảng vẽ tự do"></canvas>
        </div>
        <div class="controls">
          <button class="btn" id="btnFreeUndo">Hoàn tác</button>
          <button class="btn" id="btnFreeClear">Xóa hết</button>
          <button class="btn primary" id="btnFreeSave">Tải ảnh</button>
        </div>
      </section>
    </div>

    <!-- Thanh thông báo duy nhất, cố định dưới đáy cho cả 3 tab -->
    <div class="msg" id="appMsg" aria-live="polite"><span id="appMsgText">Bấm một chấm để bắt đầu.</span></div>

<script>
"use strict";
/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function dist(a,b){ var dx=a[0]-b[0], dy=a[1]-b[1]; return Math.sqrt(dx*dx+dy*dy); }
function boardPos(evt, el){
  var r = el.getBoundingClientRect();
  return [ (evt.clientX - r.left) / r.width * 100, (evt.clientY - r.top) / r.height * 100 ];
}
var THEME = null;
function theme(){
  if(THEME) return THEME;
  var cs = getComputedStyle(document.documentElement);
  function v(n){ return cs.getPropertyValue(n).trim(); }
  THEME = {
    paper: v("--paper") || "#FFFFFF", ink: v("--ink") || "#2E2A24",
    accent: v("--accent") || "#E4572E", teal: v("--teal") || "#0E7C66",
    sun: v("--sun") || "#F2A007", sky: v("--sky") || "#2D7FB8",
    guide: v("--guide") || "#B9AE97"
  };
  return THEME;
}
if(window.matchMedia){
  var mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  if(mqDark.addEventListener) mqDark.addEventListener("change", function(){ THEME = null; renderGame(); renderDraw(); if(typeof renderTrace === "function") renderTrace(); });
}
var audioCtx = null;
function tone(freq, t0, dur){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    var t = audioCtx.currentTime + (t0||0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.15));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + (dur||0.15) + 0.05);
  }catch(e){}
}

function difficultyOf(L){
  var n = L.edges.length;
  if(n <= 2) return "làm quen";
  if(n <= 4) return "dễ";
  if(n <= 6) return "vừa";
  return "khó";
}
var gameCanvas = $("gameCanvas"), gtx = gameCanvas.getContext("2d");
var G = {
  idx:0, used:{}, usedCount:0, current:null, strokes:0, history:[],
  finished:false, hintUsed:false, hintNode:null, seconds:0, timer:null, started:false,
  pointer:null, stars: LEVELS.map(function(){ return 0; }),
  blind:false, blindStrokes:[], blindCur:null, blindDrawing:false,
  blindDone: LEVELS.map(function(){ return false; }), maxUnlocked:0
};
function edgeKey(a,b){ return a < b ? a+"-"+b : b+"-"+a; }
function levelEdgeMap(L){
  var m = {};
  L.edges.forEach(function(e,i){ m[edgeKey(e[0],e[1])] = i; });
  return m;
}
function oddNodes(L){
  var deg = L.nodes.map(function(){ return 0; });
  L.edges.forEach(function(e){ deg[e[0]]++; deg[e[1]]++; });
  var out = [];
  deg.forEach(function(d,i){ if(d % 2 === 1) out.push(i); });
  return out;
}
function fmtTime(s){ return Math.floor(s/60) + ":" + ("0" + (s%60)).slice(-2); }

function buildLevelPicker(){

     (mở khóa ở nút "Vẽ xong" của phần tự vẽ không hướng dẫn). */
  var L = LEVELS[G.idx];

  var nextOpen = !!G.blindDone[G.idx];
  $("levelNow").innerHTML =
    '<span class="t">Màn ' + (G.idx+1) + " / " + LEVELS.length + " · " + L.name + "</span>" +
    '<span class="s">' + L.edges.length + " đường · " + difficultyOf(L) +
    (last ? " · cuối" : (nextOpen ? "" : " · chưa mở màn sau")) + "</span>";
  var total = G.stars.reduce(function(a,b){ return a+b; }, 0);
  $("totalText").textContent = total + " / " + (LEVELS.length*3) + " sao";
  $("totalStars").textContent = total > 0 ? "★" : "☆☆☆";
}
function setGameMsg(text, bad){ pushMsg("game", text, bad); }
function stopTimer(){ if(G.timer){ clearInterval(G.timer); G.timer = null; } }
function startTimer(){
  stopTimer();
  G.timer = setInterval(function(){ G.seconds++; $("hudTime").textContent = fmtTime(G.seconds); }, 1000);
}
function loadLevel(i){
  if(i > G.maxUnlocked){
    setGameMsg("Màn " + (i+1) + " chưa mở.", true);
    return;
  }
  G.idx = i; G.used = {}; G.usedCount = 0; G.current = null; G.strokes = 0;
  G.history = []; G.finished = false; G.hintUsed = false; G.hintNode = null;
  G.seconds = 0; G.started = false; G.pointer = null; stopTimer();
  G.blind = false; G.blindStrokes = []; G.blindCur = null; G.blindDrawing = false;
  $("blindBar").hidden = true;
  $("winOverlay").classList.remove("show");
  $("hudTime").textContent = "0:00";
  var L = LEVELS[i], odds = oddNodes(L);
  if(odds.length === 2) setGameMsg("Màn " + (i+1) + " · " + L.name + " — bắt đầu ở chấm vàng.");
  else setGameMsg("Màn " + (i+1) + " · " + L.name + " — bấm 1 chấm.");

}
function updateHud(){
  var L = LEVELS[G.idx];
  $("hudLevel").textContent = (G.idx+1) + " / " + LEVELS.length;
  $("hudEdges").textContent = G.usedCount + " / " + L.edges.length;
  $("hudStrokes").textContent = G.current === null && G.strokes === 0 ? "–" : String(G.strokes);
  $("btnPrev").disabled = G.idx === 0;
  var nextLocked = !G.blindDone[G.idx];
  $("btnNext").disabled = G.idx === LEVELS.length - 1 || nextLocked;
  $("btnNext").textContent = "Sau ›";
  $("winNext").disabled = G.idx === LEVELS.length - 1 || nextLocked;
  $("winNext").textContent = G.idx === LEVELS.length - 1 ? "Màn cuối rồi" : "Màn tiếp theo";
}
function renderGame(){
  var L = LEVELS[G.idx], T = theme(), odds = oddNodes(L), S = 9; /* 100 units -> 900 px */
  gtx.clearRect(0, 0, 900, 900);
  gtx.lineCap = "round"; gtx.lineJoin = "round";
  /* blind mode: no guide, no dots — just the player's own freehand strokes */
  if(G.blind){
    gtx.setLineDash([]);
    gtx.strokeStyle = T.accent; gtx.lineWidth = 24;
    G.blindStrokes.concat(G.blindCur ? [G.blindCur] : []).forEach(function(st){
      gtx.beginPath();
      st.forEach(function(p,i){ if(i === 0) gtx.moveTo(p[0]*S, p[1]*S); else gtx.lineTo(p[0]*S, p[1]*S); });
      if(st.length === 1) gtx.lineTo(st[0][0]*S + 1, st[0][1]*S + 1);
      gtx.stroke();
    });
    return;
  }
  /* Hình KHÔNG hiện sẵn: không vẽ đường mờ của cả hình.
     Chỉ khi đã đứng ở 1 chấm mới hiện mờ các đường CHƯA vẽ đi ra từ chấm đó
     (vẽ tới đâu hiện tới đó); đường đã vẽ thì hiện đậm ở dưới. */
  if(G.current !== null && !G.finished){
    gtx.setLineDash([20, 16]);
    gtx.strokeStyle = T.guide; gtx.globalAlpha = 0.6; gtx.lineWidth = 10;
    L.edges.forEach(function(e,i){
      if(G.used[i]) return;
      if(e[0] !== G.current && e[1] !== G.current) return;
      gtx.beginPath();
      gtx.moveTo(L.nodes[e[0]][0]*S, L.nodes[e[0]][1]*S);
      gtx.lineTo(L.nodes[e[1]][0]*S, L.nodes[e[1]][1]*S);
      gtx.stroke();
    });
    gtx.setLineDash([]); gtx.globalAlpha = 1;
  }
  /* drawn edges */
  gtx.strokeStyle = T.accent; gtx.lineWidth = 24;
  L.edges.forEach(function(e,i){
    if(!G.used[i]) return;
    gtx.beginPath();
    gtx.moveTo(L.nodes[e[0]][0]*S, L.nodes[e[0]][1]*S);
    gtx.lineTo(L.nodes[e[1]][0]*S, L.nodes[e[1]][1]*S);
    gtx.stroke();
  });
  /* live preview line from current node to pointer — shows the pointer is tracked */
  if(G.current !== null && G.pointer && !G.finished){
    gtx.strokeStyle = T.accent; gtx.globalAlpha = 0.45; gtx.lineWidth = 16;
    gtx.setLineDash([26, 18]);
    gtx.beginPath();
    gtx.moveTo(L.nodes[G.current][0]*S, L.nodes[G.current][1]*S);
    gtx.lineTo(G.pointer[0]*S, G.pointer[1]*S);
    gtx.stroke();
    gtx.setLineDash([]); gtx.globalAlpha = 1;
  }
  /* nodes */
  L.nodes.forEach(function(n,i){
    var x = n[0]*S, y = n[1]*S;
    if(G.hintNode === i){
      gtx.strokeStyle = T.sky; gtx.lineWidth = 14;
      gtx.beginPath(); gtx.arc(x, y, 58, 0, Math.PI*2); gtx.stroke();
    }
    if(odds.indexOf(i) >= 0 && G.usedCount === 0){
      gtx.strokeStyle = T.sun; gtx.lineWidth = 12;
      gtx.beginPath(); gtx.arc(x, y, 44, 0, Math.PI*2); gtx.stroke();
    }
    var isCur = G.current === i;
    gtx.beginPath(); gtx.arc(x, y, isCur ? 34 : 26, 0, Math.PI*2);
    gtx.fillStyle = isCur ? T.accent : T.paper; gtx.fill();
    gtx.strokeStyle = isCur ? T.accent : T.ink; gtx.lineWidth = 13; gtx.stroke();
  });
}
function eulerTrail(L, usedMap, start){
  var adj = L.nodes.map(function(){ return []; });
  L.edges.forEach(function(e,i){
    if(usedMap[i]) return;
    adj[e[0]].push({to:e[1], id:i}); adj[e[1]].push({to:e[0], id:i});
  });
  var usedLocal = {}, stack = [start], edgeStack = [], path = [];
  while(stack.length){
    var v = stack[stack.length-1];
    var nxt = null;
    for(var k=0;k<adj[v].length;k++){ if(!usedLocal[adj[v][k].id]){ nxt = adj[v][k]; break; } }
    if(nxt){ usedLocal[nxt.id] = true; stack.push(nxt.to); edgeStack.push(nxt.id); }
    else { path.push(stack.pop()); edgeStack.pop(); }
  }
  path.reverse();
  var remaining = L.edges.filter(function(e,i){ return !usedMap[i]; }).length;
  return (path.length - 1 === remaining) ? path : null;
}
function traverseTo(node){
  var L = LEVELS[G.idx], map = levelEdgeMap(L);
  var ei = map[edgeKey(G.current, node)];
  G.used[ei] = true; G.usedCount++;
  G.history.push({type:"edge", edge:ei, from:G.current, to:node});
  G.current = node; G.hintNode = null;
  pop();
  renderGame(); updateHud();
  if(G.usedCount === L.edges.length){ winLevel(); return; }
  var hasNext = L.edges.some(function(e,i){
    return !G.used[i] && (e[0] === G.current || e[1] === G.current);
  });
  if(!hasNext) setGameMsg("Hết đường — hoàn tác hoặc chọn chấm khác.", true);
  else setGameMsg("Đã vẽ " + G.usedCount + "/" + L.edges.length + " đường.");
}
function jumpTo(node){
  G.history.push({type:"jump", from:G.current, to:node});
  G.current = node; G.strokes++; G.hintNode = null;
  setGameMsg("Sang chấm mới — nét thứ " + G.strokes + ".", true);
  renderGame(); updateHud();
}
function gameNodeAction(node){
  if(G.finished) return;
  if(!G.started){ G.started = true; startTimer(); }
  if(G.current === null){
    G.current = node; G.strokes = 1; G.hintNode = null;
    G.history.push({type:"start", to:node});
    setGameMsg("Bắt đầu! Kéo tới chấm kề bên.");
    renderGame(); updateHud(); return;
  }
  if(node === G.current) return;
  var L = LEVELS[G.idx], map = levelEdgeMap(L);
  var ei = map[edgeKey(G.current, node)];
  if(ei !== undefined && !G.used[ei]) traverseTo(node);
  else if(ei !== undefined && G.used[ei]) setGameMsg("Đường đó vẽ rồi — chọn đường khác.", true);
  else jumpTo(node);
}
function hitNode(pt){
  var L = LEVELS[G.idx], best = null, bd = 10;
  L.nodes.forEach(function(n,i){ var d = dist(pt,n); if(d < bd){ bd = d; best = i; } });
  return best;
}
var penIsDown = false;
gameCanvas.addEventListener("pointerdown", function(e){
  e.preventDefault();
  if(G.blind){
    G.blindDrawing = true;
    try{ gameCanvas.setPointerCapture(e.pointerId); }catch(err){}
    G.blindCur = [boardPos(e, gameCanvas)];
    renderGame(); return;
  }
  penIsDown = true;
  try{ gameCanvas.setPointerCapture(e.pointerId); }catch(err){}
  var pt = boardPos(e, gameCanvas);
  G.pointer = pt;
  var n = hitNode(pt);
  if(n !== null) gameNodeAction(n);
  renderGame();
});
gameCanvas.addEventListener("pointermove", function(e){
  if(G.blind){
    if(G.blindDrawing && G.blindCur){
      var bp = boardPos(e, gameCanvas), bl = G.blindCur[G.blindCur.length-1];
      if(dist(bp, bl) > 0.9){ G.blindCur.push(bp); renderGame(); }
    }
    return;
  }
  var pt = boardPos(e, gameCanvas);
  G.pointer = pt;
  if(penIsDown && !G.finished && G.current !== null){
    var n = hitNode(pt);
    if(n !== null && n !== G.current){
      var L = LEVELS[G.idx], map = levelEdgeMap(L);
      var ei = map[edgeKey(G.current, n)];
      if(ei !== undefined && !G.used[ei]){ traverseTo(n); return; }
    }
  }
  if(!G.finished) renderGame();
});
["pointerup","pointercancel"].forEach(function(ev){
  gameCanvas.addEventListener(ev, function(){
    if(G.blind){

      G.blindDrawing = false; G.blindCur = null; renderGame(); return;
    }
    penIsDown = false; renderGame();

});
gameCanvas.addEventListener("pointerleave", function(){ G.pointer = null; if(!G.finished) renderGame(); });
function winLevel(){

  if(G.hintUsed && stars === 3) stars = 2;
  if(stars > G.stars[G.idx]) G.stars[G.idx] = stars;
  $("winStars").innerHTML = [1,2,3].map(function(k){
    return '<span class="'+(k <= stars ? "" : "off")+'">★</span>';

/* Bảng thắng có 2 pha: vừa thắng -> hiện nút "Tự vẽ không hướng dẫn", ẩn nút màn tiếp;

function showWinPhase(blindDone){

  else if(h.type === "jump"){ G.current = h.from; G.strokes--; }
  else if(h.type === "start"){ G.current = null; G.strokes = 0; }

$("btnHint").addEventListener("click", function(){

    var trail = eulerTrail(L, G.used, G.current);

      G.hintNode = trail[1];

      renderGame(); return;
    }
  }
  var starts = oddNodes(L).filter(function(n){
    return L.edges.some(function(e,i){ return !G.used[i] && (e[0]===n || e[1]===n); });
  });
  if(starts.length === 0) starts = L.nodes.map(function(_,i){ return i; }).filter(function(n){
    return L.edges.some(function(e,i){ return !G.used[i] && (e[0]===n || e[1]===n); });
  });
  for(var s=0;s<starts.length;s++){
    var t2 = eulerTrail(L, G.used, starts[s]);

      setGameMsg(G.current === null

        : "Kẹt — bấm chấm vòng xanh hoặc hoàn tác.");
      renderGame(); return;
    }
  }
  setGameMsg("Kẹt — hoàn tác vài bước rồi thử lại.", true);
});
loadLevel(0);

<script>
"use strict";
/* ================================================================
   HỌC VẼ — Phần 2 · Tự vẽ: bảng trống hoàn toàn, KHÔNG có nét đứt nào,
   người học tự vẽ lại theo trí nhớ rồi chấm điểm (mẫu chỉ dùng để chấm).
   Chấm điểm: so nét người vẽ với nét mẫu (độ phủ + độ đúng chỗ).
   Mỗi hình là 1 tập đường mẫu (mỗi đường là dãy điểm [x,y]).
   ================================================================ */
function circ(cx, cy, r, n){
  var p = [], N = n || 44;
  for(var i=0;i<=N;i++){ var a = i/N*Math.PI*2; p.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); }
  return p;
}
function ell(cx, cy, rx, ry, n){
  var p = [], N = n || 48;
  for(var i=0;i<=N;i++){ var a = i/N*Math.PI*2; p.push([cx + rx*Math.cos(a), cy + ry*Math.sin(a)]); }
  return p;
}
function line(a, b, n){
  var p = [], N = n || 16;
  for(var i=0;i<=N;i++){ p.push([a[0] + (b[0]-a[0])*i/N, a[1] + (b[1]-a[1])*i/N]); }
  return p;
}
function quad(a, c, b, n){
  var p = [], N = n || 22;
  for(var i=0;i<=N;i++){
    var t = i/N, u = 1-t;
    p.push([u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]]);

}
function join(){
  var out = [];
  for(var i=0;i<arguments.length;i++){
    var seg = arguments[i];
    for(var j=0;j<seg.length;j++){ if(out.length && j===0) continue; out.push(seg[j]); }
  }
  return out;
}
function rectPath(x, y, w, h){
  return join(line([x,y],[x+w,y]), line([x+w,y],[x+w,y+h]), line([x+w,y+h],[x,y+h]), line([x,y+h],[x,y]));
}
var FIGURES = [
  { name:"Con mèo", paths:[

    join(line([48,33],[59,14]), line([59,14],[67,38])),

  ]},
  { name:"Con cá", paths:[

    join(line([68,50],[89,33]), line([89,33],[89,67]), line([89,67],[68,50])),

    circ(27,45,3.2,20),
    join(line([46,33],[58,24]), line([58,24],[62,34]))
  ]},
  { name:"Ngôi nhà", paths:[

    join(line([61,33],[61,20]), line([61,20],[68,20]), line([68,20],[68,38]))

  { name:"Bông hoa", paths:[

    circ(50,36,6,26),
    quad([50,44],[47,62],[50,82]),

  ]},
  { name:"Ô tô", paths:[
    join(line([13,64],[13,53]), quad([13,53],[22,49],[32,48]), line([32,48],[39,36]), line([39,36],[61,36]), line([61,36],[69,48]), quad([69,48],[82,50],[87,54]), line([87,54],[87,64])),
    line([13,64],[87,64]),
    circ(30,64,8,30), circ(70,64,8,30),
    join(line([50,37],[50,48]), line([39,48],[69,48]))
  ]},
  { name:"Con chim", paths:[
    ell(47,55,26,16),
    circ(71,41,10,32),
    join(line([79,38],[90,42]), line([90,42],[79,47])),
    join(quad([32,52],[44,42],[56,52]), quad([56,52],[44,58],[32,52])),

];
function pathsToSvg(paths, attrs){

    var d = p.map(function(pt,i){ return (i===0 ? "M" : "L") + pt[0].toFixed(1) + " " + pt[1].toFixed(1); }).join(" ");

  }).join("");
}
var drawCanvas = $("drawCanvas"), dtx = drawCanvas.getContext("2d");
var DR = {
  idx:0, strokes:[], cur:null, drawing:false,

/* Hình sau ẨN hẳn: chỉ mở khi học xong hình hiện tại

var FIG_UNLOCK = { max: 0 };
function buildFigurePicker(){
  /* KHÔNG hiện lưới các hình nữa: chỉ hiện hình ĐANG học.

  var f = FIGURES[DR.idx];

    '<span class="s">' +
    (DR.best[DR.idx] >= 0 ? "cao nhất " + DR.best[DR.idx] + "đ" : "chưa chấm") +

  setLearnMsg("Hình " + (i+1) + " · " + FIGURES[i].name + " — tự vẽ rồi chấm điểm.");
}
function renderDraw(){
  var T = theme(), S = 9;
  dtx.clearRect(0, 0, 900, 900);
  dtx.lineCap = "round"; dtx.lineJoin = "round";
  /* Tự vẽ KHÔNG hướng dẫn: bảng trống hoàn toàn — không vẽ nét đứt, không vẽ hình mẫu,
     chỉ hiện những nét người học tự vẽ (hình mẫu chỉ dùng ngầm để chấm điểm). */
  dtx.setLineDash([]);

  var all = DR.strokes.concat(DR.cur ? [DR.cur] : []);
  all.forEach(function(st){
    dtx.beginPath();
    st.forEach(function(p,i){ if(i === 0) dtx.moveTo(p[0]*S, p[1]*S); else dtx.lineTo(p[0]*S, p[1]*S); });
    if(st.length === 1) dtx.lineTo(st[0][0]*S + 1, st[0][1]*S + 1);
    dtx.stroke();
  });
}
drawCanvas.addEventListener("pointerdown", function(e){
  e.preventDefault(); DR.drawing = true;
  try{ drawCanvas.setPointerCapture(e.pointerId); }catch(err){}

});
drawCanvas.addEventListener("pointermove", function(e){
  if(!DR.drawing || !DR.cur) return;

  if(dist(p, last) > 0.9){ DR.cur.push(p); renderDraw(); }
});
["pointerup","pointercancel"].forEach(function(ev){
  drawCanvas.addEventListener(ev, function(){
    if(!DR.drawing) return;

  });
});
$("btnDrawUndo").addEventListener("click", function(){
  DR.strokes.pop(); renderDraw();

});
$("btnDrawClear").addEventListener("click", function(){
  DR.strokes = []; DR.cur = null; renderDraw();

  setLearnMsg("Đã xóa — vẽ lại rồi chấm điểm.");
});
$("btnLessonPrev").addEventListener("click", function(){ if(DR.idx > 0) loadFigure(DR.idx - 1); });
$("btnLessonNext").addEventListener("click", function(){
  if(DR.idx >= FIG_UNLOCK.max && DR.idx < FIGURES.length - 1){

    return;
  }
  if(DR.idx < FIGURES.length - 1) loadFigure(DR.idx + 1);
});

/* ----- Chấm điểm ----- */
function samplePoints(paths, step){
  var out = [];
  paths.forEach(function(p){
    for(var i=0;i<p.length;i+=step) out.push(p[i]);
  });
  return out;
}
function nearAny(pt, pts, tol){
  var t2 = tol*tol;
  for(var i=0;i<pts.length;i++){
    var dx = pt[0]-pts[i][0], dy = pt[1]-pts[i][1];
    if(dx*dx + dy*dy <= t2) return true;
  }
  return false;
}
$("btnScore").addEventListener("click", function(){
  var user = [];
  DR.strokes.forEach(function(s){ s.forEach(function(p){ user.push(p); }); });
  if(user.length < 8){
    setLearnMsg("Chưa vẽ gì — vẽ trước đã!", true);
    $("scoreBox").classList.remove("show");
    return;
  }
  var TOL = 6.5;
  var sample = samplePoints(FIGURES[DR.idx].paths, 1);
  var hitS = 0;
  sample.forEach(function(p){ if(nearAny(p, user, TOL)) hitS++; });
  var coverage = sample.length ? hitS / sample.length : 0;
  var userSampled = samplePoints([user], 2);
  var hitU = 0;
  userSampled.forEach(function(p){ if(nearAny(p, sample, TOL)) hitU++; });
  var precision = userSampled.length ? hitU / userSampled.length : 0;
  var score = Math.round(100 * (0.62 * coverage + 0.38 * precision));
  if(score > 100) score = 100;
  var stars = score >= 85 ? 3 : (score >= 65 ? 2 : (score >= 40 ? 1 : 0));
  var verdict = score >= 85 ? "Rất giống mẫu!" :
    score >= 65 ? "Khá giống rồi!" :
    score >= 40 ? "Nhận ra hình rồi!" :
    "Chưa giống — đồ lại ở Phần 1.";
  if(score > DR.best[DR.idx]) DR.best[DR.idx] = score;
  $("scoreNum").textContent = score;
  $("scoreStars").innerHTML = [1,2,3].map(function(k){
    return '<span class="'+(k <= stars ? "" : "off")+'">★</span>';
  }).join("");
  $("scoreText").innerHTML = "<strong>" + verdict + "</strong> Phủ " +
    Math.round(coverage*100) + "% · đúng chỗ " + Math.round(precision*100) + "%.";
  $("scoreBox").classList.add("show");
  if(score >= 40 && unlockNextFigure())
    setLearnMsg("Hình " + FIGURES[DR.idx].name + ": " + score + " điểm — đã mở hình sau!");
  else
    setLearnMsg("Hình " + FIGURES[DR.idx].name + ": " + score + " điểm.");
  if(stars >= 2){ fanfare(); confetti($("drawCard")); } else pop();
  buildFigurePicker();
});
/* ================================================================
   PHẦN 1 · VẼ HỌC — đồ theo nét đứt từng bước, ngay trên canvas
   (vẽ bằng chuột / ngón tay, cùng cơ chế pointer như tab Vẽ Tự Do).
   Nét đứt vẽ bằng canvas nên luôn nhìn thấy rõ, không phụ thuộc SVG.
   ================================================================ */
var FIGURE_STEPS = [
  [ {label:"Vẽ vòng tròn làm đầu mèo", paths:[0]}, {label:"Vẽ 2 tai nhọn", paths:[1,2]}, {label:"Vẽ mắt, mũi và miệng", paths:[3,4,5]}, {label:"Vẽ râu mèo", paths:[6]} ],
  [ {label:"Vẽ thân cá", paths:[0]}, {label:"Vẽ đuôi cá", paths:[1]}, {label:"Vẽ vây cá", paths:[2,4]}, {label:"Vẽ mắt cá", paths:[3]} ],
  [ {label:"Vẽ tường nhà", paths:[0]}, {label:"Vẽ mái nhà", paths:[1]}, {label:"Vẽ cửa ra vào", paths:[2]}, {label:"Vẽ cửa sổ", paths:[3]}, {label:"Vẽ ống khói", paths:[4]} ],
  [ {label:"Vẽ 5 cánh hoa", paths:[0,1,2,3,4]}, {label:"Vẽ nhụy hoa ở giữa", paths:[5]}, {label:"Vẽ thân hoa", paths:[6]}, {label:"Vẽ chiếc lá", paths:[7]} ],
  [ {label:"Vẽ thân xe", paths:[0,1]}, {label:"Vẽ 2 bánh xe", paths:[2]}, {label:"Vẽ cửa kính xe", paths:[3]} ],
  [ {label:"Vẽ thân chim", paths:[0]}, {label:"Vẽ đầu và mỏ chim", paths:[1,2]}, {label:"Vẽ cánh chim", paths:[3]}, {label:"Vẽ chân và mắt", paths:[4]} ]
];
var traceCanvas = $("traceCanvas"), ttx = traceCanvas.getContext("2d");
var TR = { strokes:[], cur:null, drawing:false, done:false, peek:false, shownDone:-1 };
function traceSteps(){ return FIGURE_STEPS[DR.idx]; }
function setTraceMsg(t, bad){ pushMsg("trace", t, bad); }
var TRACE_NEED = 0.9;
/* Độ tô kín của TỪNG nét trong cả hình (đo trên toàn bộ mực người học đã vẽ):
   nét nào đạt >= 90% mới tính là tô kín. */
function tracePathCoverage(){
  var F = FIGURES[DR.idx], user = [];
  TR.strokes.forEach(function(s){ s.forEach(function(p){ user.push(p); }); });
  if(TR.cur) TR.cur.forEach(function(p){ user.push(p); });
  return F.paths.map(function(pts){
    if(!user.length) return 0;
    var hit = 0;
    pts.forEach(function(p){ if(nearAny(p, user, 6)) hit++; });
    return pts.length ? hit / pts.length : 1;
  });
}
function traceCurrentStep(covs){
  var steps = traceSteps();
  for(var i=0;i<steps.length;i++){
    for(var j=0;j<steps[i].paths.length;j++){
      if(covs[steps[i].paths[j]] < TRACE_NEED) return i;
    }
  }
  return steps.length - 1;
}
/* Nét đứt DUY NHẤT được hiện: nét chưa tô kín đầu tiên theo thứ tự các bước.
   Mọi nét còn lại (chưa tới lượt) đều ẨN hẳn — vẽ tới đâu mới hiện tới đó. */
function traceTargetPath(covs){
  var steps = traceSteps();
  for(var i=0;i<steps.length;i++){
    for(var j=0;j<steps[i].paths.length;j++){
      if(covs[steps[i].paths[j]] < TRACE_NEED) return steps[i].paths[j];
    }
  }
  return -1;
}
function updateTraceHud(){
  var covs = tracePathCoverage();
  var doneCount = covs.filter(function(c){ return c >= TRACE_NEED; }).length;
  $("traceStepNum").textContent = doneCount + " / " + covs.length;
  $("traceStepLabel").textContent = TR.done ? "Xong cả hình!" : traceSteps()[traceCurrentStep(covs)].label;
}
function resetTrace(){
  TR.strokes = []; TR.cur = null;
  TR.drawing = false; TR.done = false; TR.peek = false; TR.shownDone = -1;
  var pk = $("btnTracePeek");
  pk.textContent = "Xem hình"; pk.setAttribute("aria-pressed", "false");
  updateTraceHud();

function strokePaths(ctx, paths, S){
  paths.forEach(function(p){
    ctx.beginPath();
    p.forEach(function(pt,i){ if(i === 0) ctx.moveTo(pt[0]*S, pt[1]*S); else ctx.lineTo(pt[0]*S, pt[1]*S); });
    ctx.stroke();
  });
}
function renderTrace(){
  var T = theme(), S = 9, F = FIGURES[DR.idx], steps = traceSteps();

  if(TR.peek){
    ttx.setLineDash([]); ttx.strokeStyle = T.sky; ttx.globalAlpha = 0.45; ttx.lineWidth = 20;

    ttx.globalAlpha = 1;
  }
  /* guide: hình ẨN gần hết — chỉ hiện ĐÚNG 1 nét đứt cam: nét đang cần tô.
     Các nét chưa tới lượt không vẽ gì cả. Tô kín nét này (>= 90%)
     mới hiện nét tiếp theo. Nét đã tô kín thì mực người học đã phủ lên. */
  if(!TR.done){
    var target = traceTargetPath(tracePathCoverage());
    if(target >= 0){
      ttx.setLineDash([30, 20]);
      ttx.strokeStyle = T.accent;
      ttx.globalAlpha = 0.95;
      ttx.lineWidth = 17;
      strokePaths(ttx, [F.paths[target]], S);
      ttx.setLineDash([]); ttx.globalAlpha = 1;
    }
  }
  /* user's ink */
  ttx.setLineDash([]); ttx.strokeStyle = T.accent; ttx.lineWidth = 24;
  TR.strokes.concat(TR.cur ? [TR.cur] : []).forEach(function(st){
    ttx.beginPath();
    st.forEach(function(p,i){ if(i === 0) ttx.moveTo(p[0]*S, p[1]*S); else ttx.lineTo(p[0]*S, p[1]*S); });
    if(st.length === 1) ttx.lineTo(st[0][0]*S + 1, st[0][1]*S + 1);
    ttx.stroke();
  });
}
function traceCheckDone(){
  var covs = tracePathCoverage();
  var doneCount = covs.filter(function(c){ return c >= TRACE_NEED; }).length;
  updateTraceHud();
  if(doneCount === covs.length){
    TR.done = true; updateTraceHud(); renderTrace();
    var openedFig = unlockNextFigure();
    setTraceMsg("Xong! Kín hết " + covs.length + " nét." + (openedFig ? " Đã mở hình sau!" : " Sang Phần 2 tự vẽ nhé!"));
    fanfare(); confetti($("traceCard"));
  } else if(doneCount > TR.shownDone){
    TR.shownDone = doneCount; pop();
    setTraceMsg("Kín " + doneCount + "/" + covs.length + " nét — hiện nét tiếp.");
  }
}
traceCanvas.addEventListener("pointerdown", function(e){
  e.preventDefault(); TR.drawing = true;
  try{ traceCanvas.setPointerCapture(e.pointerId); }catch(err){}
  TR.cur = [boardPos(e, traceCanvas)];
  renderTrace();
});
traceCanvas.addEventListener("pointermove", function(e){
  if(!TR.drawing || !TR.cur) return;
  var p = boardPos(e, traceCanvas), last = TR.cur[TR.cur.length - 1];
  if(dist(p, last) > 0.9){ TR.cur.push(p); renderTrace(); }
});
["pointerup","pointercancel"].forEach(function(ev){
  traceCanvas.addEventListener(ev, function(){
    if(!TR.drawing) return;
    TR.drawing = false;
    if(TR.cur && TR.cur.length >= 1) TR.strokes.push(TR.cur);
    TR.cur = null; renderTrace();
    if(!TR.done && TR.strokes.length) traceCheckDone();
  });
});
$("btnTraceUndo").addEventListener("click", function(){

  else setTraceMsg("Chưa có nét nào để hoàn tác.", true);
});
$("btnTraceResetStep").addEventListener("click", function(){
  resetTrace(); renderTrace();
});
$("btnTracePeek").addEventListener("click", function(){
  TR.peek = !TR.peek;
  this.textContent = TR.peek ? "Ẩn hình" : "Xem hình";
  this.setAttribute("aria-pressed", TR.peek ? "true" : "false");

/* --- Chuyển 2 phần của tab Học Vẽ --- */
function setLearnPart(p){
  var trace = p === "trace";
  CUR.part = trace ? "trace" : "self";
  $("partTrace").hidden = !trace;
  $("partSelf").hidden = trace;
  $("subLearn").setAttribute("aria-pressed", trace ? "true" : "false");
  $("subSelf").setAttribute("aria-pressed", trace ? "false" : "true");
  showMsg();
  if(trace) renderTrace(); else renderDraw();
}
$("subLearn").addEventListener("click", function(){ setLearnPart("trace"); });
$("subSelf").addEventListener("click", function(){ setLearnPart("self"); });

loadFigure(0);

/* ================================================================
   VẼ TỰ DO
   ================================================================ */
var freeCanvas = $("freeCanvas"), fctx = freeCanvas.getContext("2d");
var FREE_COLORS = ["#2E2A24","#E4572E","#F2A007","#0E7C66","#2D7FB8","#D65076","#7A4FA3","#8A5A2B"];
var FREE_SIZES = [{label:"Bút nhỏ", w:5, dot:7},{label:"Bút vừa", w:11, dot:13},{label:"Bút to", w:20, dot:22}];
var FR = { color: FREE_COLORS[1], size: FREE_SIZES[1], strokes: [], drawing:false, cur:null };
function buildFreeTools(){
  var sw = $("swatches");
  FREE_COLORS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "sw"; b.type = "button"; b.style.background = c;
    b.setAttribute("aria-label", "Màu " + c);
    b.setAttribute("aria-pressed", c === FR.color ? "true" : "false");
    b.addEventListener("click", function(){
      FR.color = c;
      sw.querySelectorAll(".sw").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    });
    sw.appendChild(b);
  });
  var sz = $("sizes");
  FREE_SIZES.forEach(function(s){
    var b = document.createElement("button");
    b.className = "size-btn"; b.type = "button";
    b.setAttribute("aria-label", s.label);
    b.setAttribute("aria-pressed", s === FR.size ? "true" : "false");
    b.innerHTML = '<i style="width:'+s.dot+'px;height:'+s.dot+'px"></i>';
    b.addEventListener("click", function(){
      FR.size = s;
      sz.querySelectorAll(".size-btn").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    });
    sz.appendChild(b);
  });
}
function redrawFree(){
  fctx.fillStyle = "#FFFFFF";
  fctx.fillRect(0, 0, freeCanvas.width, freeCanvas.height);
  fctx.lineCap = "round"; fctx.lineJoin = "round";
  var all = FR.strokes.concat(FR.cur ? [FR.cur] : []);
  all.forEach(function(st){
    fctx.strokeStyle = st.color; fctx.lineWidth = st.w;
    fctx.beginPath();
    st.pts.forEach(function(p,i){ if(i === 0) fctx.moveTo(p[0], p[1]); else fctx.lineTo(p[0], p[1]); });
    if(st.pts.length === 1) fctx.lineTo(st.pts[0][0] + 0.1, st.pts[0][1] + 0.1);
    fctx.stroke();
  });
}
function canvasPos(e){
  var r = freeCanvas.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width * freeCanvas.width, (e.clientY - r.top) / r.height * freeCanvas.height ];
}
freeCanvas.addEventListener("pointerdown", function(e){
  e.preventDefault(); FR.drawing = true;
  try{ freeCanvas.setPointerCapture(e.pointerId); }catch(err){}
  FR.cur = { color: FR.color, w: FR.size.w, pts: [canvasPos(e)] };
  redrawFree();
});
freeCanvas.addEventListener("pointermove", function(e){
  if(!FR.drawing || !FR.cur) return;
  var p = canvasPos(e), last = FR.cur.pts[FR.cur.pts.length-1];
  if(Math.abs(p[0]-last[0]) + Math.abs(p[1]-last[1]) > 3){ FR.cur.pts.push(p); redrawFree(); }
});
["pointerup","pointercancel"].forEach(function(ev){
  freeCanvas.addEventListener(ev, function(){
    if(!FR.drawing) return;
    FR.drawing = false;
    if(FR.cur && FR.cur.pts.length){ FR.strokes.push(FR.cur); pushMsg("free", "Đã có " + FR.strokes.length + " nét vẽ."); }
    FR.cur = null; redrawFree();
  });
});
$("btnFreeUndo").addEventListener("click", function(){
  FR.strokes.pop(); redrawFree();
  pushMsg("free", FR.strokes.length ? "Đã hoàn tác 1 nét." : "Bảng trống rồi.");
});
$("btnFreeClear").addEventListener("click", function(){
  FR.strokes = []; FR.cur = null; redrawFree();
  pushMsg("free", "Đã xóa hết — vẽ bức mới nào!");
});
$("btnFreeSave").addEventListener("click", function(){
  var a = document.createElement("a");
  a.download = "tranh-ve-tu-do.png";
  a.href = freeCanvas.toDataURL("image/png");
  a.click();
  pushMsg("free", "Đã tải ảnh về máy.");
});
buildFreeTools();
redrawFree();
</script>
